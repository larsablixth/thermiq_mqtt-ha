blueprint:
  name: ThermIQ – pre-heat the floor in cheap hours (beta)
  description: >
    Stores heat in a concrete floor slab: raises the indoor target a little
    in cheap hours ahead of an expensive spell, and lowers it while prices
    are high so the slab gives the heat back.

    It only acts when the price gap pays for what loading the slab costs:
    the heat pump runs less efficiently at a higher supply temperature, and a
    warmer house leaks more heat. The **break-even ratio** is that cost: the
    expensive hours must cost at least this many times the cheap ones (on
    what you actually pay, so enter a time-of-day grid fee if you have one).

    Prices: Tibber, Nordpool (HACS) or Entso-e; hourly and 15-minute prices
    both work. See docs/floor_preheat.md.

    While enabled it owns the indoor target. Change the **normal indoor
    target** here, not on the heat pump, or it will be overwritten.
  domain: automation
  homeassistant:
    # The variables action updating outer-scope variables (Tibber path)
    min_version: 2025.4.0
  source_url: https://github.com/larsablixth/thermiq_mqtt-ha/blob/master/custom_components/thermiq_mqtt/blueprints/floor_preheat.yaml
  input:
    price_source:
      name: Price source
      default: tibber
      selector:
        select:
          options:
            - label: Tibber
              value: tibber
            - label: Nordpool (HACS)
              value: nordpool
            - label: Entso-e
              value: entsoe
    price_sensor:
      name: Price sensor (Nordpool / Entso-e only)
      description: Not used with Tibber, which is asked for prices directly.
      default: ""
      selector:
        entity:
          domain: sensor
    target_entity:
      name: Indoor target
      description: The heat pump's indoor target temperature.
      default: number.thermiq_mqtt_vp1_indoor_requested_t
      selector:
        entity:
          domain: number
    base_target:
      name: Normal indoor target
      description: The indoor target used when no price shift is worth it.
      default: 21
      selector:
        number:
          min: 10
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
          mode: box
    boost:
      name: Pre-heat raise
      description: >
        How much to raise the indoor target in cheap hours. 1 °C is a good
        start; beyond 1.5 °C the extra saving is small and the swing is felt.
      default: 1
      selector:
        number:
          min: 0
          max: 3
          step: 0.5
          unit_of_measurement: "°C"
          mode: box
    coast:
      name: Expensive-hour drop
      description: >
        How much to lower the indoor target in expensive hours, so the slab
        gives back its heat instead of the pump buying more. 0 = never below
        normal.
      default: 1
      selector:
        number:
          min: 0
          max: 3
          step: 0.5
          unit_of_measurement: "°C"
          mode: box
    breakeven:
      name: Break-even ratio
      description: >
        How many times more the expensive hours must cost before shifting is
        worth it. Lower = shifts more often.
      default: 1.3
      selector:
        number:
          min: 1.05
          max: 3
          step: 0.05
          mode: box
    window_hours:
      name: Look-ahead (hours)
      description: >
        How far ahead to look for an expensive spell, and how far back for the
        cheap hours that loaded the slab. Roughly how long the slab holds its
        heat.
      default: 8
      selector:
        number:
          min: 2
          max: 16
          step: 1
          unit_of_measurement: h
          mode: box
    peak_fee:
      name: Extra grid fee in peak hours
      description: >
        If your grid fee is higher at certain times (e.g. Vattenfall's time
        tariff: +0.46 SEK/kWh weekdays 06–22, November–March), enter the
        difference here. Same unit as the prices. 0 = flat grid fee.
      default: 0
      selector:
        number:
          min: 0
          max: 100
          step: 0.01
          mode: box
    other_fees:
      name: Other costs per kWh
      description: >
        What you pay per kWh on top of the price source that is the same every
        hour (energy tax, the off-peak grid fee, supplier markup). It does
        not change which hours are cheap, but it shrinks the ratio between
        them. Same unit as the prices. Tibber's price already includes VAT
        and markup, not grid fee or energy tax.
      default: 0
      selector:
        number:
          min: 0
          max: 100
          step: 0.01
          mode: box
    peak_start_hour:
      name: Peak hours start
      default: 6
      selector:
        number:
          min: 0
          max: 23
          step: 1
          mode: box
    peak_end_hour:
      name: Peak hours end
      default: 22
      selector:
        number:
          min: 1
          max: 24
          step: 1
          mode: box
    peak_months:
      name: Peak months
      default: ["1", "2", "3", "11", "12"]
      selector:
        select:
          multiple: true
          options:
            - { label: January, value: "1" }
            - { label: February, value: "2" }
            - { label: March, value: "3" }
            - { label: April, value: "4" }
            - { label: May, value: "5" }
            - { label: June, value: "6" }
            - { label: July, value: "7" }
            - { label: August, value: "8" }
            - { label: September, value: "9" }
            - { label: October, value: "10" }
            - { label: November, value: "11" }
            - { label: December, value: "12" }

mode: restart

triggers:
  - trigger: time_pattern
    minutes: "/15"
    seconds: 30
  - trigger: homeassistant
    event: start

variables:
  price_source: !input price_source
  price_sensor: !input price_sensor
  target_entity: !input target_entity
  base_target: !input base_target
  boost: !input boost
  coast: !input coast
  breakeven: !input breakeven
  window_hours: !input window_hours
  peak_fee: !input peak_fee
  other_fees: !input other_fees
  peak_start_hour: !input peak_start_hour
  peak_end_hour: !input peak_end_hour
  peak_months: !input peak_months
  # [[unix timestamp, price], ...] from Nordpool or Entso-e attributes.
  # Tibber fills tibber_slots in the actions instead.
  attr_slots: >-
    {%- set ns = namespace(s=[]) -%}
    {%- if price_source == 'nordpool' -%}
      {%- for i in (state_attr(price_sensor, 'raw_today') or [])
                 + (state_attr(price_sensor, 'raw_tomorrow') or []) -%}
        {%- if i.value is number -%}
          {%- set ns.s = ns.s + [[as_timestamp(i.start), i.value]] -%}
        {%- endif -%}
      {%- endfor -%}
    {%- elif price_source == 'entsoe' -%}
      {%- for i in state_attr(price_sensor, 'prices') or [] -%}
        {%- if i.price is number -%}
          {%- set ns.s = ns.s + [[as_timestamp(i.time), i.price]] -%}
        {%- endif -%}
      {%- endfor -%}
    {%- endif -%}
    {{ ns.s }}
  tibber_slots: []

actions:
  - if:
      - condition: template
        value_template: "{{ price_source == 'tibber' }}"
    then:
      - action: tibber.get_prices
        data:
          start: "{{ (now() - timedelta(hours=24)).isoformat() }}"
          end: "{{ (now() + timedelta(hours=36)).isoformat() }}"
        response_variable: tibber_reply
        continue_on_error: true
      # Normalise the reply (first home) to [[timestamp, price], ...]
      - variables:
          tibber_slots: >-
            {%- set ns = namespace(s=[]) -%}
            {%- set homes = (tibber_reply | default({})).get('prices', {}) -%}
            {%- for home in homes.values() -%}
              {%- if loop.first -%}
                {%- for i in home -%}
                  {%- if i.price is number -%}
                    {%- set ns.s = ns.s + [[as_timestamp(i.start_time), i.price]] -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.s }}
  # The decision lives in this one template so it can be tested on its own
  # (tests/test_floor_preheat_blueprint.py). Result: boost, coast, normal,
  # or unknown (no usable prices: falls back to normal).
  - variables:
      decision: >-
        {%- set slots = (tibber_slots if price_source == 'tibber' else attr_slots)
                        | sort(attribute=0) -%}
        {%- set t = as_timestamp(now()) -%}
        {%- set ns = namespace(cur=none, costs=[]) -%}
        {%- set months = peak_months | map('int') | list -%}
        {%- set fixed = other_fees | float(0) -%}
        {%- for s in slots -%}
          {%- set nxt = slots[loop.index][0] if not loop.last
                        else s[0] + (s[0] - slots[loop.index0 - 1][0] if loop.length > 1 else 3600) -%}
          {%- set lt = as_local(as_datetime(s[0])) -%}
          {%- set peak = lt.weekday() < 5 and lt.month in months
                         and peak_start_hour | int <= lt.hour < peak_end_hour | int -%}
          {%- set ns.costs = ns.costs + [[s[0], s[1] + fixed
                             + (peak_fee | float(0) if peak else 0)]] -%}
          {%- if s[0] <= t < nxt -%}{%- set ns.cur = ns.costs[-1] -%}{%- endif -%}
        {%- endfor -%}
        {%- if ns.cur is none -%}
          unknown
        {%- else -%}
          {%- set w = window_hours | float(8) * 3600 -%}
          {%- set be = breakeven | float(1.3) -%}
          {%- set now_p = ns.cur[1] -%}
          {%- set ahead = ns.costs | selectattr(0, '>', ns.cur[0])
                          | selectattr(0, '<=', ns.cur[0] + w) | map(attribute=1) | list -%}
          {%- set behind = ns.costs | selectattr(0, '<', ns.cur[0])
                           | selectattr(0, '>=', ns.cur[0] - w) | map(attribute=1) | list -%}
          {%- if ahead and (now_p <= 0 or (ahead | max) >= be * now_p) -%}
            boost
          {%- elif behind and (behind | min) > 0 and now_p >= be * (behind | min) -%}
            coast
          {%- else -%}
            normal
          {%- endif -%}
        {%- endif -%}
      new_target: >-
        {%- set b = base_target | float(21) -%}
        {%- if decision == 'boost' -%}{{ b + boost | float(0) }}
        {%- elif decision == 'coast' -%}{{ b - coast | float(0) }}
        {%- else -%}{{ b }}
        {%- endif -%}
  # Only write when the value changes: every write is a register write.
  - condition: template
    value_template: >-
      {{ states(target_entity) | float(-100) != new_target | float }}
  - action: number.set_value
    target:
      entity_id: "{{ target_entity }}"
    data:
      value: "{{ new_target }}"
